[build-system]
requires = ["setuptools>=42.0.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"


# https://peps.python.org/pep-0621/
[project]
name = "napari-guitils"
description = "Utils to create napari guis"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD 3-Clause License" }
authors = [
    { email = "guillaume.witz@unibe.ch", name = "Guillaume Witz" },
]
dynamic = ["version"]
dependencies = [
    "natsort",
    "qtpy",
]

# extras
# https://peps.python.org/pep-0621/#dependencies-optional-dependencies
[project.optional-dependencies]
testing = [
    "tox", 
    "pytest", 
    "pytest-cov", 
    "pytest-qt", 
    "napari",
    "pyqt5"
]

[project.urls]
homepage = "https://github.com/guiwitz/napari-guitils"
repository = "https://github.com/guiwitz/napari-guitils"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
write_to = "src/napari_guitils/_version.py"
